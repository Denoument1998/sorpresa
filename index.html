<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-title" content="Mi día">
<title>Mi día</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐾</text></svg>">
<style>
  :root {
    --bg: #f5f5f7; --card: #ffffff; --ink: #1d1d1f; --muted: #86868b; --line: #e5e5ea;
    --accent: #0071e3; --accent-soft: #e8f1fc; --ok: #34c759; --cat: #9a9a9f; --paw: #f2f2f4;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #000000; --card: #1c1c1e; --ink: #f5f5f7; --muted: #8e8e93; --line: #2c2c2e;
      --accent: #0a84ff; --accent-soft: #0b2440; --ok: #30d158; --cat: #6e6e73; --paw: #d1d1d6;
      --shadow: none; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #000000; --card: #1c1c1e; --ink: #f5f5f7; --muted: #8e8e93; --line: #2c2c2e;
    --accent: #0a84ff; --accent-soft: #0b2440; --ok: #30d158; --cat: #6e6e73; --paw: #d1d1d6;
    --shadow: none; color-scheme: dark;
  }
  :root[data-theme="light"] { color-scheme: light; }

  .quiz-q { font-size: 19px; font-weight: 600; letter-spacing: -0.01em; margin: 2px 0 14px; }
  .quiz-opts { display: grid; gap: 8px; }
  .quiz-opts button { background: var(--bg); color: var(--ink); text-align: left; padding: 12px 14px; border: 1.5px solid transparent; }
  .quiz-opts button:disabled { cursor: default; opacity: .55; }
  .quiz-opts button.right { border-color: var(--ok); opacity: 1; }
  .quiz-opts button.wrong { border-color: #ff3b30; opacity: 1; }
  .quiz-result { margin-top: 14px; }
  .quiz-result p { margin: 0 0 4px; }
  .quiz-result .fact { color: var(--muted); font-size: 15px; }
  .quiz-actions { display: flex; justify-content: space-between; margin-top: 10px; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 17px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased; letter-spacing: -0.01em;
  }
  main { max-width: 540px; margin: 0 auto; padding: 40px 16px 64px; }

  header { display: flex; align-items: center; gap: 14px; margin-bottom: 6px; }
  .avatar { width: 46px; height: 46px; border-radius: 50%; object-fit: cover; object-position: 50% 15%; flex: 0 0 46px; }
  h1 { font-size: 34px; font-weight: 700; letter-spacing: -0.03em; margin: 0; line-height: 1.1; }
  .date { color: var(--muted); font-size: 15px; margin: 2px 0 0; }
  .quote { color: var(--muted); font-size: 15px; margin: 14px 0 28px; font-style: italic; }

  .card { background: var(--card); border-radius: 18px; padding: 18px; margin-bottom: 16px; box-shadow: var(--shadow); }
  .section-title { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin: 0 4px 8px; font-weight: 600; }

  .now { position: relative; margin-top: 46px; }
  .cat { position: absolute; top: -37px; right: 26px; width: 74px; height: 42px; }
  .now .task { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; margin: 2px 0 16px; word-break: break-word; }
  .now .when { color: var(--accent); font-size: 15px; font-weight: 600; }
  .now .empty { font-size: 19px; margin: 0; }
  .alldone { text-align: center; }
  .alldone img { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; object-position: 50% 12%; margin: 4px auto 12px; display: block; }

  button { font: inherit; cursor: pointer; border: 0; border-radius: 12px; padding: 10px 16px; transition: transform .1s, opacity .2s; }
  button:active { transform: scale(.97); }
  .primary { background: var(--accent); color: #fff; font-weight: 600; width: 100%; padding: 13px; font-size: 17px; border-radius: 14px; }
  .link { background: none; color: var(--accent); padding: 6px 4px; }
  .quiet { background: none; color: var(--muted); padding: 6px 8px; }

  form { display: flex; gap: 8px; flex-wrap: wrap; }
  input, select {
    font: inherit; color: var(--ink); background: var(--bg); border: 1px solid transparent;
    border-radius: 12px; padding: 11px 13px; min-width: 0; outline: none;
  }
  input:focus, select:focus { border-color: var(--accent); }
  form input[type=text] { flex: 1 1 200px; }
  form input[type=time] { flex: 0 0 118px; }
  form button { background: var(--ink); color: var(--card); font-weight: 600; }

  .head-row { display: flex; align-items: baseline; justify-content: space-between; }
  .progress { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; margin: 10px 0 4px; }
  .progress > div { height: 100%; background: var(--ok); width: 0; border-radius: 99px; transition: width .5s cubic-bezier(.2,.8,.2,1); }

  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  li:last-child { border-bottom: 0; }
  .check {
    width: 24px; height: 24px; flex: 0 0 24px; border-radius: 50%; border: 1.5px solid var(--muted);
    background: transparent; padding: 0; display: grid; place-items: center; transition: background .2s, border-color .2s;
  }
  .check svg { width: 13px; height: 13px; opacity: 0; transition: opacity .2s; }
  li.done .check { background: var(--accent); border-color: var(--accent); }
  li.done .check svg { opacity: 1; }
  li.done .text { color: var(--muted); }
  .text { flex: 1; word-break: break-word; transition: color .2s; }
  .time { font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .del { background: none; color: var(--muted); padding: 2px 6px; opacity: .5; font-size: 15px; }
  .del:hover { opacity: 1; }
  .hint { color: var(--muted); font-size: 14px; margin: 10px 2px 0; }

  .banner { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  details summary { cursor: pointer; color: var(--muted); list-style: none; }
  details summary::-webkit-details-marker { display: none; }
  details[open] summary { margin-bottom: 4px; }
  .row { display: flex; gap: 10px; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .row:last-of-type { border-bottom: 0; }

  #toast {
    position: fixed; left: 50%; top: 18px; transform: translate(-50%, -160%);
    background: color-mix(in srgb, var(--card) 82%, transparent);
    -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
    color: var(--ink); padding: 14px 20px; border-radius: 18px; max-width: 92vw; width: max-content;
    font-weight: 500; transition: transform .45s cubic-bezier(.2,.9,.2,1); z-index: 10;
    box-shadow: 0 10px 40px rgba(0,0,0,.15); border: 1px solid var(--line); text-align: center;
  }
  #toast.show { transform: translate(-50%, 0); }
  #toast small { display: block; color: var(--muted); font-weight: 400; margin-top: 2px; }
  .burst { position: fixed; pointer-events: none; font-size: 18px; animation: fly .9s ease-out forwards; z-index: 9; }
  @keyframes fly { to { transform: translate(var(--dx), var(--dy)) rotate(var(--r)); opacity: 0; } }
</style>
</head>
<body>
<main>
  <header>
    <img class="avatar" id="avatar" src="gata.jpg" alt="" onerror="this.remove()">
    <div>
      <h1 id="hello">Hoy</h1>
      <p class="date" id="date"></p>
    </div>
  </header>
  <p class="quote" id="quote"></p>

  <div class="card" id="leftover" hidden>
    <div class="banner">
      <span id="leftoverText"></span>
      <span>
        <button class="link" id="bringOver">Pasarlas a hoy</button>
        <button class="quiet" id="dismissLeftover">Ahora no</button>
      </span>
    </div>
  </div>

  <div class="card now">
    <svg class="cat" viewBox="0 0 80 46" aria-hidden="true">
      <path d="M17 44 C17 24 25 14 40 14 C55 14 63 24 63 44 Z" fill="var(--cat)"/>
      <path d="M21 26 L19 4 L35 15 Z" fill="var(--cat)"/>
      <path d="M59 26 L61 4 L45 15 Z" fill="var(--cat)"/>
      <path d="M24 21 L23 11 L30 16 Z" fill="var(--paw)" opacity=".55"/>
      <path d="M56 21 L57 11 L50 16 Z" fill="var(--paw)" opacity=".55"/>
      <path d="M33 44 C33 36 36 32 40 32 C44 32 47 36 47 44 Z" fill="var(--paw)"/>
      <ellipse cx="32" cy="29" rx="2.3" ry="2.8" fill="var(--card)"/>
      <ellipse cx="48" cy="29" rx="2.3" ry="2.8" fill="var(--card)"/>
      <path d="M38.3 34.5 L41.7 34.5 L40 36.3 Z" fill="#f4a3b4"/>
      <ellipse cx="25" cy="43" rx="8" ry="4.2" fill="var(--paw)" stroke="var(--cat)" stroke-width="1"/>
      <ellipse cx="55" cy="43" rx="8" ry="4.2" fill="var(--paw)" stroke="var(--cat)" stroke-width="1"/>
    </svg>
    <div class="section-title" style="margin-left:0">Ahora toca</div>
    <div id="nowBody"></div>
  </div>

  <div class="card" id="quizCard" hidden>
    <div class="section-title" style="margin-left:0">Pregunta del momento 🧠</div>
    <div class="quiz-q" id="quizQ"></div>
    <div class="quiz-opts" id="quizOpts"></div>
    <div class="quiz-result" id="quizResult"></div>
  </div>

  <div class="card">
    <form id="addForm" autocomplete="off">
      <input type="text" id="newText" placeholder="Agregar algo para hoy" required>
      <input type="time" id="newTime" title="Hora (opcional)">
      <button type="submit">Agregar</button>
    </form>
    <p class="hint">La hora es opcional. Si le pones una, te aviso 10 minutos antes y a la hora.</p>
  </div>

  <div class="card">
    <div class="head-row">
      <strong id="countText">Lista de hoy</strong>
      <button class="link" id="clearDone">Quitar hechas</button>
    </div>
    <div class="progress"><div id="bar"></div></div>
    <ul id="list"></ul>
  </div>

  <div class="card">
    <details>
      <summary>Ajustes</summary>
      <div class="row">
        <label for="name">Tu nombre</label>
        <input id="name" type="text" placeholder="Nombre" style="flex:1; max-width:200px">
      </div>
      <div class="row">
        <label for="catName">Nombre de tu gata</label>
        <input id="catName" type="text" placeholder="Nombre" style="flex:1; max-width:200px">
      </div>
      <div class="row">
        <label for="nudge">Recordarme lo pendiente</label>
        <select id="nudge">
          <option value="0">Nunca</option>
          <option value="30">Cada 30 min</option>
          <option value="60">Cada hora</option>
          <option value="90">Cada hora y media</option>
          <option value="120">Cada 2 horas</option>
        </select>
      </div>
      <div class="row">
        <label for="pause">Recordarme pausas</label>
        <select id="pause">
          <option value="0">Nunca</option>
          <option value="60">Cada hora</option>
          <option value="90">Cada hora y media</option>
          <option value="120">Cada 2 horas</option>
        </select>
      </div>
      <div class="row">
        <label for="theme">Apariencia</label>
        <select id="theme">
          <option value="auto">Automática</option>
          <option value="light">Clara</option>
          <option value="dark">Oscura</option>
        </select>
      </div>
      <div class="row">
        <label for="quizOn">Pregunta de cultura general cuando llega la hora</label>
        <input id="quizOn" type="checkbox">
      </div>
      <div class="row">
        <span id="scoreText" style="color:var(--muted); font-size:15px"></span>
        <button class="link" id="quizNow">Jugar una ahora</button>
      </div>
      <div class="row">
        <label for="sound">Sonido</label>
        <input id="sound" type="checkbox">
      </div>
      <div class="row">
        <span id="notifStatus" style="color:var(--muted); font-size:15px"></span>
        <button class="link" id="enableNotif">Activar notificaciones</button>
      </div>
      <p class="hint">Los avisos funcionan mientras esta página esté abierta, aunque esté minimizada. Solo salen entre 8:00 y 22:00.</p>
    </details>
  </div>
</main>
<div id="toast"></div>

<script>
(() => {
  const KEY = 'mi-dia-v1';
  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2, '0');
  const dayKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const toMin = hm => { const [h, m] = hm.split(':').map(Number); return h * 60 + m; };
  const pick = a => a[Math.floor(Math.random() * a.length)];

  let state = {
    days: {}, settings: { name: 'Augusto', catName: 'la Gordita', nudge: 60, pause: 90, sound: true, theme: 'auto', quiz: true },
    lastNudge: 0, lastPause: 0, dismissed: '', quiz: null, score: { ok: 0, total: 0 }, asked: []
  };
  try {
    const saved = JSON.parse(localStorage.getItem(KEY));
    if (saved) state = Object.assign(state, saved, { settings: Object.assign(state.settings, saved.settings || {}) });
  } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };

  const catLower = () => state.settings.catName || 'tu gata';
  const cat = () => { const c = catLower(); return c.charAt(0).toUpperCase() + c.slice(1); };

  // mensajitos de amor (salen de vez en cuando, de sorpresa)
  const love = [
    ['Te quiero mucho. 🧡', 'Y estoy muy orgullosa de ti.'],
    ['Estoy orgullosa de ti.', 'De verdad, lo estás haciendo increíble. 🧡'],
    ['Lo estás haciendo súper.', 'Te quiero mucho, no lo olvides. 🧡'],
    ['Pasaba a recordarte algo:', 'te quiero muchísimo. 🧡'],
    ['Me encanta verte avanzar.', 'Estoy muy orgullosa de ti. 🧡'],
  ];
  const sometimesLove = (list, chance) => Math.random() < chance ? pick(love) : pick(list);

  // ---------- banco de preguntas: [pregunta, correcta, [incorrectas], dato] ----------
  const QUIZ = [
    ['¿Cuál es la capital de Australia?', 'Canberra', ['Sídney', 'Melbourne', 'Perth'], 'Canberra se construyó como capital para resolver la rivalidad entre Sídney y Melbourne.'],
    ['¿Cuál es la capital de Canadá?', 'Ottawa', ['Toronto', 'Montreal', 'Vancouver'], 'Ottawa fue elegida capital por la reina Victoria en 1857.'],
    ['¿Cuál es la capital de Brasil?', 'Brasilia', ['Río de Janeiro', 'São Paulo', 'Salvador'], 'Brasilia se inauguró en 1960 y fue planificada desde cero.'],
    ['¿Cuál es la capital de Turquía?', 'Ankara', ['Estambul', 'Esmirna', 'Antalya'], 'Estambul es la ciudad más grande, pero la capital es Ankara desde 1923.'],
    ['¿Cuál es la capital de Suiza?', 'Berna', ['Zúrich', 'Ginebra', 'Basilea'], 'En Suiza a Berna se le llama oficialmente "ciudad federal".'],
    ['¿Cuál es la capital de Nueva Zelanda?', 'Wellington', ['Auckland', 'Christchurch', 'Queenstown'], 'Wellington es la capital más austral del mundo.'],
    ['¿Cuál es la capital de Marruecos?', 'Rabat', ['Casablanca', 'Marrakech', 'Fez'], 'Casablanca es la ciudad más grande de Marruecos, pero la capital es Rabat.'],
    ['¿Cuál es la capital de Noruega?', 'Oslo', ['Bergen', 'Estocolmo', 'Copenhague'], 'Estocolmo es la capital de Suecia y Copenhague la de Dinamarca.'],
    ['¿Cuál es la capital de Corea del Sur?', 'Seúl', ['Busan', 'Pionyang', 'Incheon'], 'Pionyang es la capital de Corea del Norte.'],
    ['¿Cuál es la capital de Kenia?', 'Nairobi', ['Mombasa', 'Adís Abeba', 'Kampala'], 'Nairobi tiene un parque nacional con jirafas y leones dentro de la ciudad.'],
    ['¿Cuál es la capital de Islandia?', 'Reikiavik', ['Oslo', 'Helsinki', 'Akureyri'], 'Reikiavik es la capital más al norte de un país soberano.'],
    ['¿Cuál es la capital de Vietnam?', 'Hanói', ['Ho Chi Minh', 'Da Nang', 'Hue'], 'Ho Chi Minh, antes Saigón, es la ciudad más grande del país.'],
    ['¿Cuál es la capital de Nigeria?', 'Abuja', ['Lagos', 'Kano', 'Ibadán'], 'Abuja reemplazó a Lagos como capital en 1991.'],
    ['¿Cuál es la capital de Pakistán?', 'Islamabad', ['Karachi', 'Lahore', 'Peshawar'], 'Islamabad fue construida como capital en los años sesenta.'],
    ['¿Cuál es la capital de Hungría?', 'Budapest', ['Viena', 'Praga', 'Bucarest'], 'Budapest nació de la unión de Buda y Pest, a cada lado del Danubio.'],
    ['¿Cuál es la capital de Finlandia?', 'Helsinki', ['Tallin', 'Oslo', 'Turku'], 'Tallin, la capital de Estonia, está a unas dos horas en ferry de Helsinki.'],
    ['¿Cuál es la capital de Ecuador?', 'Quito', ['Guayaquil', 'Cuenca', 'Manta'], 'Quito está a unos 2 850 metros de altura.'],
    ['¿Cuál es la capital de Uruguay?', 'Montevideo', ['Punta del Este', 'Asunción', 'Colonia'], 'Asunción es la capital de Paraguay.'],
    ['¿Cuál es la capital de Filipinas?', 'Manila', ['Cebú', 'Quezón', 'Davao'], 'Filipinas tiene más de 7 000 islas.'],
    ['¿Cuál es la capital de Egipto?', 'El Cairo', ['Alejandría', 'Luxor', 'Giza'], 'Las pirámides de Giza están en las afueras de El Cairo.'],
    ['¿Quién escribió La Divina Comedia?', 'Dante Alighieri', ['Francesco Petrarca', 'Giovanni Boccaccio', 'Nicolás Maquiavelo'], 'Dante la escribió a inicios del siglo XIV y se divide en Infierno, Purgatorio y Paraíso.'],
    ['¿Quién escribió Cien años de soledad?', 'Gabriel García Márquez', ['Mario Vargas Llosa', 'Julio Cortázar', 'Isabel Allende'], 'Se publicó en 1967 y transcurre en el pueblo ficticio de Macondo.'],
    ['¿Quién escribió Don Quijote de la Mancha?', 'Miguel de Cervantes', ['Lope de Vega', 'Francisco de Quevedo', 'Calderón de la Barca'], 'La primera parte se publicó en 1605.'],
    ['¿Quién escribió Romeo y Julieta?', 'William Shakespeare', ['Charles Dickens', 'Oscar Wilde', 'Jane Austen'], 'La historia transcurre en Verona, Italia.'],
    ['¿Quién escribió El principito?', 'Antoine de Saint-Exupéry', ['Julio Verne', 'Victor Hugo', 'Albert Camus'], 'Saint-Exupéry también era piloto, y eso se nota en la historia.'],
    ['¿Quién escribió 1984?', 'George Orwell', ['Aldous Huxley', 'Ray Bradbury', 'H. G. Wells'], 'De esa novela viene la expresión "el Gran Hermano te vigila".'],
    ['¿Qué peruano ganó el Nobel de Literatura en 2010?', 'Mario Vargas Llosa', ['César Vallejo', 'Julio Ramón Ribeyro', 'José María Arguedas'], 'Entre sus novelas más conocidas están La ciudad y los perros y Conversación en La Catedral.'],
    ['¿Quién pintó La noche estrellada?', 'Vincent van Gogh', ['Claude Monet', 'Pablo Picasso', 'Salvador Dalí'], 'Van Gogh la pintó en 1889 desde la ventana de un hospital en Francia.'],
    ['¿Quién pintó la Mona Lisa?', 'Leonardo da Vinci', ['Miguel Ángel', 'Rafael', 'Botticelli'], 'Está en el Museo del Louvre, en París.'],
    ['¿Quién pintó el techo de la Capilla Sixtina?', 'Miguel Ángel', ['Leonardo da Vinci', 'Rafael', 'Caravaggio'], 'Le tomó unos cuatro años, de 1508 a 1512.'],
    ['¿Quién compuso la Novena Sinfonía, la del "Himno a la alegría"?', 'Ludwig van Beethoven', ['Wolfgang Amadeus Mozart', 'Johann Sebastian Bach', 'Frédéric Chopin'], 'Beethoven ya estaba prácticamente sordo cuando la compuso.'],
    ['¿Cuál es el planeta más grande del sistema solar?', 'Júpiter', ['Saturno', 'Neptuno', 'Urano'], 'En Júpiter cabrían más de 1 300 Tierras.'],
    ['¿Qué planeta es conocido como el planeta rojo?', 'Marte', ['Venus', 'Mercurio', 'Júpiter'], 'Su color viene del óxido de hierro en su superficie.'],
    ['¿Cuántos huesos tiene el cuerpo de un adulto?', '206', ['186', '226', '256'], 'Los bebés nacen con más huesos, que luego se fusionan.'],
    ['¿Cuál es el hueso más largo del cuerpo humano?', 'El fémur', ['La tibia', 'El húmero', 'El peroné'], 'El fémur está en el muslo.'],
    ['¿Cuál es el océano más grande?', 'Pacífico', ['Atlántico', 'Índico', 'Ártico'], 'El Pacífico es más grande que toda la tierra firme del planeta junta.'],
    ['¿En qué año llegó el ser humano a la Luna?', '1969', ['1965', '1972', '1959'], 'Neil Armstrong y Buzz Aldrin caminaron en la Luna con el Apolo 11.'],
    ['¿Cuál es el símbolo químico del oro?', 'Au', ['Ag', 'Or', 'Go'], 'Viene del latín "aurum". Ag es la plata.'],
    ['¿Quién propuso la teoría de la relatividad?', 'Albert Einstein', ['Isaac Newton', 'Nikola Tesla', 'Stephen Hawking'], 'Einstein publicó la relatividad especial en 1905.'],
    ['¿Qué científica ganó dos premios Nobel en ciencias distintas?', 'Marie Curie', ['Rosalind Franklin', 'Ada Lovelace', 'Lise Meitner'], 'Ganó el de Física en 1903 y el de Química en 1911.'],
    ['¿Qué gas absorben las plantas para hacer la fotosíntesis?', 'Dióxido de carbono', ['Oxígeno', 'Nitrógeno', 'Helio'], 'A cambio, liberan oxígeno.'],
    ['¿Cuál es el animal terrestre más rápido?', 'El guepardo', ['El león', 'El caballo', 'La gacela'], 'Puede superar los 100 km/h en carreras cortas.'],
    ['¿Cuál es el único mamífero capaz de volar?', 'El murciélago', ['La ardilla voladora', 'El colibrí', 'El pingüino'], 'La ardilla voladora planea, pero no vuela de verdad.'],
    ['¿Cuántos corazones tiene un pulpo?', 'Tres', ['Uno', 'Dos', 'Ocho'], 'Además, su sangre es azul.'],
    ['Más o menos, ¿cuántas horas al día duerme un gato?', 'Entre 12 y 16', ['Entre 4 y 6', 'Entre 8 y 10', 'Entre 20 y 22'], 'La Gordita no es floja, es completamente normal. 🐾'],

  const shuffle = a => { const b = [...a]; for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
  function newQuiz() {
    if (state.asked.length >= QUIZ.length) state.asked = [];
    const free = QUIZ.map((_, i) => i).filter(i => !state.asked.includes(i));
    const i = pick(free);
    state.asked.push(i);
    const [, right, wrongs] = QUIZ.at(i);
    state.quiz = { i, opts: shuffle([right, ...wrongs]), picked: null };
  }
  function answerQuiz(opt) {
    if (!state.quiz || state.quiz.picked) return;
    state.quiz.picked = opt;
    state.score.total++;
    const ok = opt === QUIZ.at(state.quiz.i)[1];
    if (ok) state.score.ok++;
    save(); render();
    if (ok) toast('¡Correcto! 🧠', pick(['Qué crack.', 'Sabía que la sabías.', `${cat()} está impresionada. 🐾`]));
  }
  function renderQuiz() {
    const q = state.quiz;
    $('quizCard').hidden = !q;
    $('scoreText').textContent = state.score.total ? `Aciertos: ${state.score.ok} de ${state.score.total}` : 'Aún no ha jugado';
    if (!q) return;
    const [question, right, , fact] = QUIZ.at(q.i);
    $('quizQ').textContent = question;
    const opts = $('quizOpts');
    opts.innerHTML = '';
    for (const o of q.opts) {
      const b = document.createElement('button');
      b.textContent = o;
      if (q.picked) {
        b.disabled = true;
        if (o === right) b.className = 'right';
        else if (o === q.picked) b.className = 'wrong';
      }
      b.onclick = () => answerQuiz(o);
      opts.append(b);
    }
    const res = $('quizResult');
    res.innerHTML = '';
    if (!q.picked) return;
    const msg = document.createElement('p');
    msg.innerHTML = q.picked === right ? '<strong>¡Correcto!</strong>' : '<strong>Casi.</strong> La respuesta correcta es: ';
    if (q.picked !== right) msg.append(Object.assign(document.createElement('strong'), { textContent: right }));
    const f = document.createElement('p');
    f.className = 'fact';
    f.textContent = 'Dato: ' + fact;
    const actions = document.createElement('div');
    actions.className = 'quiz-actions';
    const more = Object.assign(document.createElement('button'), { className: 'link', textContent: 'Otra pregunta' });
    more.onclick = () => { newQuiz(); save(); render(); };
    const close = Object.assign(document.createElement('button'), { className: 'quiet', textContent: 'Cerrar' });
    close.onclick = () => { state.quiz = null; save(); render(); };
    actions.append(more, close);
    res.append(msg, f, actions);
  }

  const sorted = list => [...list].sort((a, b) => {

  });

  function render() {

    const ds = d.toLocaleDateString('es', { weekday: 'long', day: 'numeric', month: 'long' });

    $('quote').textContent = quoteOfDay();

    const done = list.filter(t => t.done).length;
    $('countText').textContent = list.length ? `${done} de ${list.length} hechas` : 'Lista de hoy';

    const next = nextTask();
    const body = $('nowBody');

      const wrap = document.createElement('div');

      li.append(c, s);

      del.onclick = () => { state.days[today] = tasks().filter(x => x.id !== t.id); save(); render(); };
      li.append(del);
      ul.append(li);
    }

    renderLeftover();
    renderNotifStatus();
    renderQuiz();

  function renderLeftover() {
    const prev = Object.keys(state.days).filter(k => k < today).sort().at(-1);

    const show = pending.length && state.dismissed !== today;
    $('leftover').hidden = !show;
    if (show) $('leftoverText').textContent = `Quedaron ${pending.length} pendiente${pending.length > 1 ? 's' : ''} de antes. No pasa nada.`;
  }

    const st = $('notifStatus'), btn = $('enableNotif');

    if (Notification.permission === 'granted') { st.textContent = 'Notificaciones activadas'; btn.hidden = true; }
    else if (Notification.permission === 'denied') { st.textContent = 'Notificaciones bloqueadas en el navegador'; btn.hidden = true; }
    else { st.textContent = 'Notificaciones apagadas'; btn.hidden = false; }
  }

  // ---------- acciones ----------
  function complete(id, ev) {
    const t = tasks().find(x => x.id === id);
    if (!t) return;
    t.done = true;
    save();
    celebrate(ev);
    const allDone = tasks().every(x => x.done);

    else toast(...sometimesLove(cheers(), 0.25));
    render();
  }

    const t = tasks().find(x => x.id === id);

  let audioCtx;
  function chime() {
    if (!state.settings.sound) return;
    try {
      audioCtx ||= new (window.AudioContext || window.webkitAudioContext)();
      [[0, 784], [0.16, 1047]].forEach(([delay, f]) => {
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = 'sine'; o.frequency.value = f;
        const t0 = audioCtx.currentTime + delay;
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(0.15, t0 + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.6);
        o.connect(g).connect(audioCtx.destination);
        o.start(t0); o.stop(t0 + 0.65);
      });
    } catch (e) {}
  }
  document.addEventListener('click', () => { try { audioCtx ||= new (window.AudioContext || window.webkitAudioContext)(); audioCtx.resume(); } catch (e) {} }, { once: true });

  let titleTimer;
  function notify(title, body) {
    chime();
    toast(title, body);
    if ('Notification' in window && Notification.permission === 'granted') {
      try { const n = new Notification(title, { body }); n.onclick = () => { window.focus(); n.close(); }; } catch (e) {}
    }
    if (document.hidden) {
      clearInterval(titleTimer);
      let on = false;
      titleTimer = setInterval(() => { document.title = (on = !on) ? '🐾 ' + title : 'Mi día'; }, 1200);
    }
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { clearInterval(titleTimer); document.title = 'Mi día'; } });

  function tick() {
    const d = new Date();
    if (dayKey(d) !== today) { today = dayKey(d); render(); }
    const m = d.getHours() * 60 + d.getMinutes();
    const awake = d.getHours() >= 8 && d.getHours() < 22;
    let changed = false;

    for (const t of tasks()) {
      if (t.done || !t.time) continue;
      const tm = toMin(t.time);
      if (!t.pre && m >= tm - 10 && m < tm) { t.pre = true; changed = true; notify('En 10 minutos', t.text); }
      if (!t.at && m >= tm && m <= tm + 5) {
        t.at = true; t.pre = true; changed = true;
        if (state.settings.quiz) {
          newQuiz();
          notify('Es hora', `${t.text} · Te dejé una pregunta 🧠`);
          render();
        } else {
          notify('Es hora', t.text);
        }
      }
    }

    const pending = tasks().filter(t => !t.done);
    const nudgeEvery = state.settings.nudge * 60000;
    if (nudgeEvery && awake && pending.length && Date.now() - state.lastNudge >= nudgeEvery) {
      if (state.lastNudge) {
        const n = nextTask();
        notify(`Sin presión: ${pending.length === 1 ? 'te queda 1' : `te quedan ${pending.length}`}`, n ? `La siguiente es: ${n.text}` : '');
      }
      state.lastNudge = Date.now(); changed = true;
    }

    const pauseEvery = state.settings.pause * 60000;
    if (pauseEvery && awake && Date.now() - state.lastPause >= pauseEvery) {
      if (state.lastPause) notify(...sometimesLove(pauses(), 0.2));
      state.lastPause = Date.now(); changed = true;
    }

    if (changed) save();
  }

  // ---------- detalles ----------
  function toast(title, sub) {
    const t = $('toast');
    t.innerHTML = '';
    t.append(document.createTextNode(title));
    if (sub) { const s = document.createElement('small'); s.textContent = sub; t.append(s); }
    t.classList.add('show');
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => t.classList.remove('show'), 4000);
  }
  function celebrate(ev) {
    const x = ev && ev.clientX ? ev.clientX : innerWidth / 2, y = ev && ev.clientY ? ev.clientY : innerHeight / 2;
    for (let i = 0; i < 8; i++) {
      const s = document.createElement('span');
      s.className = 'burst';
      s.textContent = i % 2 ? '🐾' : '✨';
      s.style.left = x + 'px'; s.style.top = y + 'px';
      s.style.setProperty('--dx', (Math.random() * 160 - 80) + 'px');
      s.style.setProperty('--dy', (Math.random() * -140 - 30) + 'px');
      s.style.setProperty('--r', (Math.random() * 90 - 45) + 'deg');
      document.body.append(s);
      setTimeout(() => s.remove(), 900);
    }
  }

  render();
  tick();
  setInterval(tick, 20000);
})();
</script>
</body>
</html>
